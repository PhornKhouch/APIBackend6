<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        .login-wrapper {
            min-height: calc(100vh - 60px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container.login-box {
            max-width: 420px;
            margin: 0 auto;
        }
    </style>
</head>

<body>

    <div class="login-wrapper">
        <div class="container login-box">
            <div class="form-header">
                <h2>Login</h2>
                <p>Enter your credentials to continue</p>
            </div>
            <div class="form-grid" style="grid-template-columns: 1fr;">
                <div class="form-group">
                    <label for="userId">UserID</label>
                    <input type="text" id="userId" placeholder="Enter user ID" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter password" autocomplete="current-password">
                </div>
            </div>
            <div class="form-footer">
                <button type="button" id="btn-add" onclick="login()">
                    <span>→</span> Login
                </button>
            </div>
        </div>
    </div>

</body>
<script>
    var api = "http://localhost:3000/api/user";

    function login() {
        const user_id = document.getElementById("userId").value.trim();
        const password = document.getElementById("password").value;

        if (!user_id || !password) {
            showAlert("Please enter both User ID and Password.", "warning", "Missing fields");
            return;
        }

        fetch(`${api}/login`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ user_id, password })
        })
            .then(async response => {
                const data = await response.json();
                if (response.ok && data.token) {
                    // store token (and user info) in localStorage
                    localStorage.setItem("token", data.token);
                    localStorage.setItem("user", JSON.stringify(data.data || {}));
                    // redirect to index.html
                    window.location.href = "index.html";
                } else {
                    showAlert(data.message || "Login failed", "error", "Login failed");
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showAlert("Network error: " + error.message, "error", "Error");
            });
    }

    // allow pressing Enter to submit
    document.addEventListener("keydown", function (e) {
        if (e.key === "Enter") login();
    });

    function showAlert(message, icon, title) {
        Swal.fire({
            title: title,
            text: message,
            icon: icon,
            confirmButtonText: 'OK'
        });
    }
</script>

</html>
