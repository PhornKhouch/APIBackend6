<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

    <div class="container">
        <div class="form-header">
            <h2>User Management</h2>
            <p>Fill in the details below to add a new user</p>
        </div>
        <div class="form-grid">
            <div class="form-group">
                <label for="userId">UserID</label>
                <input type="text" id="userId" placeholder="Enter user ID">
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Enter username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter password">
            </div>
            <div class="form-group">
                <label for="remark">Remark</label>
                <input type="text" id="remark" placeholder="Enter remark">
            </div>
        </div>
        <div class="form-footer">
            <button type="button" id="btn-add" onclick="Adduser()">
                <span>+</span> Add User
            </button>
            <button type="button" id="btn-add" class="btn-update" onclick="updateUser()" style="display:none;">
                <span>✎</span> Update User
            </button>
        </div>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Password</th>
                    <th>Remark</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="product-table-body">

            </tbody>
        </table>
    </div>
</body>
<script>
    var api = "http://localhost:3000/api/user";

    // auth guard: redirect to login if no token
    if (!localStorage.getItem("token")) {
        window.location.href = "login.html";
    }

    // build headers with the stored Bearer token
    function authHeaders(extra) {
        const token = localStorage.getItem("token");
        return Object.assign({
            'Authorization': 'Bearer ' + token
        }, extra || {});
    }

    // logout helper: clear token and go back to login
    function logout() {
        localStorage.removeItem("token");
        localStorage.removeItem("user");
        window.location.href = "login.html";
    }

    // if a request comes back 401, the token is invalid/expired -> logout
    function handleResponse(response) {
        if (response.status === 401) {
            logout();
            throw new Error("Unauthorized");
        }
        return response.json();
    }


    function getdata() {
        fetch(api, { headers: authHeaders() })
            .then(handleResponse)
            .then(data => {
                const tableBody = document.getElementById("product-table-body");
                var html = "";
                var listUser = data.result;
                for (var obj in listUser) {
                    html += `
            <tr>
                <td>${listUser[obj].user_id}</td>
                <td>${listUser[obj].username}</td>
                <td>${listUser[obj].password}</td>
                <td>${listUser[obj].remark}</td>
                <td>
                    <button onclick="editUser('${listUser[obj].user_id}')">Edit</button>
                    <button onclick="deleteUser('${listUser[obj].user_id}')">Delete</button>
                </td>
            </tr>
            `;
                }
                tableBody.innerHTML = html;
            });
    }
    //load data when page load
    window.onload = function () {
        getdata();
    }


    function Adduser() {
        const userId = document.getElementById("userId").value;
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const remark = document.getElementById("remark").value;


        //body of request
        var objectUser = {
            userid: userId,
            username: username,
            password: password,
            remark: remark
        }

        fetch(api, {
            method: 'POST',
            headers: authHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify(objectUser)
        })
            .then(handleResponse)
            .then(data => {
                console.log(data);
                getdata();
                showAlert('User added successfully.', 'success', 'Success');
            })
            .catch(error => console.error('Error:', error));
    }
    //delete user
    function deleteUser(id) {

        Swal.fire({
            title: "Are you sure?",
            text: "You won't be able to revert this!",
            icon: "warning",
            showCancelButton: true,
            confirmButtonColor: "#3085d6",
            cancelButtonColor: "#d33",
            confirmButtonText: "Yes, delete it!"
        }).then((result) => {
            if (result.isConfirmed) {
                fetch(`${api}/delete/${id}`, {
                    method: 'DELETE',
                    headers: authHeaders()
                })
                    .then(handleResponse)
                    .then(data => {
                        console.log(data);
                        getdata();
                        showAlert(data.message, 'success', 'Success');
                    })
                    .catch(error => console.error('Error:', error));
            }
        });

    }


    //edit 
    function editUser(id) {
        fetch(`${api}?id=${id}`, { headers: authHeaders() })
            .then(handleResponse)
            .then(data => {
                const user = data.result;
                document.getElementById("userId").value = user.user_id;
                document.getElementById("username").value = user.username;
                document.getElementById("password").value = user.password;
                document.getElementById("remark").value = user.remark;
                document.getElementById("userId").readOnly = true;
                //change button to update
                document.getElementById("btn-add").style.display = "none";
                document.querySelector(".btn-update").style.display = "inline-block";
            })
            .catch(error => console.error('Error:', error));
    }


    //update
    function updateUser() {
        const userId = document.getElementById("userId").value;
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;
        const remark = document.getElementById("remark").value;

        var objectUser = {
            userid: userId,
            username: username,
            password: password,
            remark: remark
        }

        fetch(`${api}/update`, {
            method: 'PUT',
            headers: authHeaders({ 'Content-Type': 'application/json' }),
            body: JSON.stringify(objectUser)
        })
            .then(handleResponse)
            .then(data => {
                console.log(data);
                getdata();
                showAlert('User updated successfully.', 'success', 'Success');
                //reset form
                document.getElementById("userId").readOnly = false;
                document.getElementById("userId").value = "";
                document.getElementById("username").value = "";
                document.getElementById("password").value = "";
                document.getElementById("remark").value = "";
                //change button to add
                document.getElementById("btn-add").style.display = "inline-block";
                document.querySelector(".btn-update").style.display = "none";
            })
            .catch(error => console.error('Error:', error));
    }
    function showAlert(message, icon, title) {
        Swal.fire({
            title: title,
            text: message,
            icon: icon,
            confirmButtonText: 'OK'
        });
    }
</script>

</html>
